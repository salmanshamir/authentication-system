
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AuthSystem{% endblock %}</title>

    <link rel="stylesheet" href=" {{ url_for("static", filename="css/style.css") }}"

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>


<body>



    <header>

        <nav class="navbar">

            <a href="{{ url_for('index') }}" class="logo">
                Auth<span>System.</span>
            </a>

            {% if session.get("user_id") %}
        <div class="nav-links">

            <a href="{{ url_for('home') }}">Home</a>

            <a href="{{ url_for('home', _anchor='about') }}">About</a>

            <a href="{{ url_for('home', _anchor='contact') }}">Contact</a>

        </div>

        <div class="nav-buttons">

                <a href="{{ url_for('profile') }}"
                   class="btn btn-outline">
                    My Profile
                </a>

                <form action="{{ url_for('logout') }}" method="POST", onsubmit="return confirm('Are you sure you want to delete this student?')">
                    <button type="submit" class="btn btn-primary">
                        Logout
                    </button>
                </form>

        </div>

            
            {% else %}


            {% endif %}




            {% block nav_link %}
            
            {% endblock  %}
            

        </nav>

    </header>

    <main>

        {% block content %}







        {% endblock %}

    </main>

    <footer>

        <div class="footer-container">

            <div class="footer-text">
                © 2026 AuthSystem. All rights reserved.
            </div>

            <div class="footer-links">

                <a href="#privacy">Privacy Policy</a>

                <a href="#terms">Terms of Service</a>

                <a href="#contact">Contact Us</a>

            </div>

        </div>

    </footer>


    {% block extra_js %}{% endblock %}

</body>

</html>
